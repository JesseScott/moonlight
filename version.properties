# The app's version, in one place. The build reads it for both the phone and the Wear OS app, the CI checks it, and a
# merge to main that changes it tags the commit and creates a GitHub release (see .github/workflows/release.yml).
# versionCode must go up with every upload to Google Play. versionName is what people see.
# The Wear OS app uses 1000 + versionCode, so both stay in step and the watch build is always the higher one.
versionName=0.6.0
versionCode=13
